
name: Build WikiGraph

on:
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build Project
        run: npm run build

  save:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: wikigraph_dist
          path: dist
          retention-days: 90